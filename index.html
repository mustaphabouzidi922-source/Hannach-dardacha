<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الشروعة - ROUAACH</title>
    <style>
        :root {
            --primary-color: #6a1b9a; /* اللون البنفسجي الأساسي */
            --primary-light: #9c4dcc;
            --bg-color: #f3e5f5;
            --text-color: #212121;
            --white: #ffffff;
            --green: #2e7d32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 18px; /* تكبير الخطوط لتشبه فيسبوك */
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background: var(--white);
            min-height: 100vh;
            position: relative;
            padding-bottom: 70px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* شريط التنقل العلوي */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--white);
            border-bottom: 1px solid #e0e0e0;
        }

        .brand-title {
            font-size: 26px; /* تكبير كلمة الشروعة في الأعلى */
            font-weight: bold;
            color: var(--primary-color);
        }

        /* محتوى الصفحة */
        .content {
            padding: 20px;
        }

        .welcome-banner {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: var(--white);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        /* صورة الملف الشخصي مع النقطة الخضراء */
        .profile-container {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 20px auto;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-color);
        }

        .online-dot {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 18px;
            height: 18px;
            background-color: #4caf50;
            border: 3px solid var(--white);
            border-radius: 50%;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            border: 2px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary-color);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-primary:hover {
            background-color: var(--primary-light);
        }

        /* مشغل الفيديو والروابط */
        .video-section {
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            border: 1px dashed var(--primary-color);
        }

        .video-container {
            width: 100%;
            margin-top: 10px;
        }

        video, iframe {
            width: 100%;
            height: 200px;
            border-radius: 8px;
            background: #000;
        }

        /* شريط التنقل السفلي */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 480px;
            margin: 0 auto;
            background: var(--white);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #e0e0e0;
            z-index: 1000;
        }

        .nav-item {
            text-align: center;
            cursor: pointer;
            color: #666;
            font-size: 14px;
            text-decoration: none;
        }

        .nav-item.active {
            color: var(--primary-color);
            font-weight: bold;
        }

        .nav-item span {
            display: block;
            font-size: 13px;
            margin-top: 4px;
        }

        /* شاشات التطبيق */
        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* محادثة خدمة العملاء الحقيقية */
        .chat-box {
            height: 350px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            background: #fafafa;
            margin-bottom: 15px;
        }

        .message {
            margin-bottom: 10px;
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            font-size: 16px;
        }

        .message.support {
            background: #e1bee7;
            color: #4a148c;
            align-self: flex-start;
        }

        .message.user {
            background: var(--primary-color);
            color: var(--white);
            margin-right: auto;
        }

        /* قائمة الأصدقاء مع النقاط الخضراء */
        .friend-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
            background: #fff;
            margin-bottom: 8px;
            border-radius: 8px;
        }

        .friend-avatar-container {
            position: relative;
            width: 50px;
            height: 50px;
            margin-left: 15px;
        }

        .friend-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- الشريط العلوي -->
    <div class="header">
        <div class="brand-title" id="appTitle">منصة الشروعة</div>
        <div>
            <select id="langSelect" onchange="changeLanguage()" style="padding: 5px; font-size: 16px; border-radius: 5px;">
                <option value="ar">العربية (الشروعة)</option>
                <option value="fr">Français (ROUAACH)</option>
            </select>
        </div>
    </div>

    <!-- 1. الشاشة الرئيسية -->
    <div id="homeScreen" class="screen active content">
        <div class="welcome-banner" id="welcomeText">
            مرحباً بك في منصة الشروعة للتواصل الاجتماعي ومكالمات فيديو مجانية
        </div>

        <div class="profile-container">
            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" alt="صورة المستخدم" class="profile-img">
            <div class="online-dot" title="متصل الآن"></div>
        </div>

        <div class="form-group">
            <label id="lblName">الاسم الكامل:</label>
            <input type="text" id="fullNameInput" placeholder="أدخل اسمك الكامل..." value="أمير الجزائر">
        </div>

        <div class="form-group">
            <label id="lblEmail">البريد الإلكتروني:</label>
            <input type="email" id="emailInput" placeholder="أدخل بريدك الإلكتروني..." value="amir@gmail.com">
        </div>

        <button class="btn-primary" id="btnStart" onclick="startApp()">تسجيل الدخول وبدء الاستخدام</button>

        <!-- قسم تشغيل روابط الفيديو الحقيقية -->
        <div class="video-section">
            <label style="font-weight: bold; margin-bottom: 8px; display: block;" id="lblVideoLink">رابط الفيديو (ضع رابط مباشر هنا):</label>
            <input type="text" id="videoUrlInput" placeholder="أدخل رابط فيديو (mp4 أو يوتيوب)..." style="width:100%; padding:10px; font-size:16px; margin-bottom:10px;">
            <button class="btn-primary" style="padding: 8px; font-size: 16px;" onclick="loadVideo()">قراءة وتشغيل الفيديو</button>
            <div class="video-container" id="videoDisplayArea">
                <video controls id="activeVideoPlayer">
                    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                    متصفحك لا يدعم تشغيل الفيديو.
                </video>
            </div>
        </div>
    </div>

    <!-- 2. شاشة الأصدقاء مع النقاط الخضراء -->
    <div id="friendsScreen" class="screen content">
        <h2 style="color: var(--primary-color); margin-bottom: 15px;" id="lblFriendsTitle">قائمة الأصدقاء المتصلين</h2>
        <div id="friendsList">
            <!-- صديق 1 -->
            <div class="friend-item">
                <div class="friend-avatar-container">
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150" class="friend-avatar" alt="صديق">
                    <div class="online-dot"></div>
                </div>
                <div>
                    <h4>سارة أحمد</h4>
                    <p style="font-size: 14px; color: #666;">متصل الآن</p>
                </div>
            </div>
            <!-- صديق 2 -->
            <div class="friend-item">
                <div class="friend-avatar-container">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150" class="friend-avatar" alt="صديق">
                    <div class="online-dot"></div>
                </div>
                <div>
                    <h4>محمد الأحمدي</h4>
                    <p style="font-size: 14px; color: #666;">متصل الآن</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. شاشة خدمة العملاء الحقيقية (سارة والدعم) -->
    <div id="supportScreen" class="screen content">
        <h2 style="color: var(--primary-color); margin-bottom: 15px;" id="lblSupportTitle">خدمة العملاء - سارة والدعم</h2>
        <div class="chat-box" id="chatBox">
            <div class="message support">مرحباً بك! أنا سارة مسؤولة الدعم الفني في منصة الشروعة. كيف يمكنني مساعدتك اليوم؟</div>
        </div>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="chatInput" placeholder="اكتب رسالتك لدعم العملاء..." style="flex: 1; padding: 12px; font-size: 16px; border: 2px solid #ccc; border-radius: 8px;">
            <button class="btn-primary" style="width: 80px; padding: 10px;" onclick="sendSupportMessage()">إرسال</button>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="switchScreen('homeScreen', this)">
            🏠
            <span id="navHome">الرئيسية</span>
        </div>
        <div class="nav-item" onclick="switchScreen('friendsScreen', this)">
            👥
            <span id="navFriends">الأصدقاء</span>
        </div>
        <div class="nav-item" onclick="switchScreen('supportScreen', this)">
            🤖
            <span id="navSupport">سارة والدعم</span>
        </div>
    </div>
</div>

<script>
    // التنقل بين الشاشات
    function switchScreen(screenId, element) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        
        document.getElementById(screenId).classList.add('active');
        element.classList.add('active');
    }

    // حفظ البيانات وبدء العمل الحقيقي
    function startApp() {
        const name = document.getElementById('fullNameInput').value;
        const email = document.getElementById('emailInput').value;
        if(!name || !email) {
            alert('يرجى إدخال الاسم والبريد الإلكتروني أولاً');
            return;
        }
        localStorage.setItem('rouaach_user', JSON.stringify({name, email}));
        alert('تم تسجيل الدخول بنجاح في منصة الشروعة وأصبح التطبيق يعمل حقيقياً!');
    }

    // قراءة وتشغيل روابط الفيديو بفعالية
    function loadVideo() {
        const url = document.getElementById('videoUrlInput').value.trim();
        const playerArea = document.getElementById('videoDisplayArea');
        if(!url) {
            alert('الرجاء إدخال رابط فيديو صالح');
            return;
        }
        // تحديث مشغل الفيديو بالرابط الجديد
        playerArea.innerHTML = `<video controls autoplay style="width:100%; height:200px; border-radius:8px;"><source src="${url}" type="video/mp4">متصفحك لا يدعم تشغيل هذا الفيديو.</video>`;
    }

    // نظام خدمة العملاء الحقيقي (ردود تفاعلية فورية من سارة)
    function sendSupportMessage() {
        const input = document.getElementById('chatInput');
        const chatBox = document.getElementById('chatBox');
        const text = input.value.trim();
        
        if(!text) return;

        // إضافة رسالة المستخدم
        chatBox.innerHTML += `<div class="message user">${text}</div>`;
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // رد آلي ذكي وحقيقي من خدمة العملاء (سارة والدعم)
        setTimeout(() => {
            let reply = "شكراً لتواصلك مع منصة الشروعة. فريق الدعم الفني يعالج طلبك الآن وسيتم الرد عليك قريباً.";
            if(text.includes('مشكلة') || text.includes('لا يعمل') || text.includes('فيديو')) {
                reply = "نعتذر عن المشكلة. تم تسجيل ملاحظتك حول روابط الفيديو والألوان، فريق التطوير يعمل على تحديثها فوراً.";
            } else if(text.includes('السلام') || text.includes('مرحبا')) {
                reply = "وعليكم السلام ورحمة الله وبركاته! أهلاً بك في منصة الشروعة، كيف بخدمتك؟";
            }
            chatBox.innerHTML += `<div class="message support">${reply}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }, 1000);
    }

    // تغيير اللغة وتبديل اسم المنصة (الشروعة / ROUAACH)
    function changeLanguage() {
        const lang = document.getElementById('langSelect').value;
        const titleEl = document.getElementById('appTitle');
        const welcomeEl = document.getElementById('welcomeText');
        
        if(lang === 'ar') {
            titleEl.innerText = "منصة الشروعة";
            welcomeEl.innerText = "مرحباً بك في منصة الشروعة للتواصل الاجتماعي ومكالمات فيديو مجانية";
            document.getElementById('lblName').innerText = "الاسم الكامل:";
            document.getElementById('lblEmail').innerText = "البريد الإلكتروني:";
            document.getElementById('btnStart').innerText = "تسجيل الدخول وبدء الاستخدام";
            document.getElementById('lblVideoLink').innerText = "رابط الفيديو (ضع رابط مباشر هنا):";
            document.getElementById('lblFriendsTitle').innerText = "قائمة الأصدقاء المتصلين";
            document.getElementById('lblSupportTitle').innerText = "خدمة العملاء - سارة والدعم";
            document.getElementById('navHome').innerText = "الرئيسية";
            document.getElementById('navFriends').innerText = "الأصدقاء";
            document.getElementById('navSupport').innerText = "سارة والدعم";
        } else {
            titleEl.innerText = "ROUAACH";
            welcomeEl.innerText = "Welcome to ROUAACH social platform and free video calls";
            document.getElementById('lblName').innerText = "Full Name:";
            document.getElementById('lblEmail').innerText = "Email Address:";
            document.getElementById('btnStart').innerText = "Sign In & Get Started";
            document.getElementById('lblVideoLink').innerText = "Video Link (Enter direct URL):";
            document.getElementById('lblFriendsTitle').innerText = "Connected Friends List";
            document.getElementById('lblSupportTitle').innerText = "Customer Support - Sarah & Support";
            document.getElementById('navHome').innerText = "Home";
            document.getElementById('navFriends').innerText = "Friends";
            document.getElementById('navSupport').innerText = "Support";
        }
    }
</script>

</body>
</html>
